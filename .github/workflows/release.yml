name: Release Bestboard

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept SDK Licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Restore release keystore (if secrets present)
        env:
          BESTBOARD_KEYSTORE_BASE64: ${{ secrets.BESTBOARD_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$BESTBOARD_KEYSTORE_BASE64" ]; then
            echo "$BESTBOARD_KEYSTORE_BASE64" | base64 -d > /tmp/bestboard-release.jks
            echo "BESTBOARD_KEYSTORE_PATH=/tmp/bestboard-release.jks" >> $GITHUB_ENV
          else
            echo "No keystore secret — release APK will be unsigned."
          fi

      - name: Build Debug & Release APK
        env:
          BESTBOARD_KEYSTORE_PASSWORD: ${{ secrets.BESTBOARD_KEYSTORE_PASSWORD }}
          BESTBOARD_KEY_ALIAS: ${{ secrets.BESTBOARD_KEY_ALIAS }}
          BESTBOARD_KEY_PASSWORD: ${{ secrets.BESTBOARD_KEY_PASSWORD }}
        run: |
          gradle assembleDebug
          gradle assembleRelease

      - name: Get tag
        id: tag
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Prepare APKs
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/debug/app-debug.apk release_apks/Bestboard-${{ steps.tag.outputs.VERSION }}-debug.apk
          cp app/build/outputs/apk/release/app-release.apk release_apks/Bestboard-${{ steps.tag.outputs.VERSION }}-release.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Bestboard ${{ steps.tag.outputs.VERSION }}"
          generate_release_notes: true
          body: |
            ## Bestboard ${{ steps.tag.outputs.VERSION }}

            ### 📥 Installation
            - `Bestboard-v...-debug.apk` installs right away (testing).
            - `Bestboard-v...-release.apk` is the release build (signed when keystore secrets are configured, unsigned otherwise).
          files: release_apks/*.apk
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
